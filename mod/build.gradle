plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'aurora-guia'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

// Client game test: starts the real game (under Xvfb in the cloud), loads the Aurora pack and takes
// screenshots of the anvil panel, tooltips, HUD and menus. Run with ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "aurora_guia_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		username = "Mundaiki"
	}
}

tasks.named("runClientGameTest") {
	// the test enables this pack before taking screenshots
	// -PauroraPacks=DIR -PauroraOrder="A,B,C" test another set of packs (bottom to top)
	jvmArgs "-Daurora.packs=${project.findProperty('auroraPacks') ?: "${rootDir}/../aurora/packs"}",
		"-Daurora.order=${project.findProperty('auroraOrder') ?: 'Aurora Pack,Aurora HUD XL,Aurora Outline,Aurora Extras'}"
}
