# Aurora EMF: use player_leggings2.jem only while the wearer has minecraft:netherite_leggings in the "legs" slot.
# ETF "nbt" property, read from the client entity NBT (LivingEntity saves "equipment").
# Entities that match no rule keep the vanilla armour model (EMF maps variant 1 to vanilla
# when there is no player_leggings.jem).
models.1=2
nbt.1.equipment.legs.id=minecraft:netherite_leggings
